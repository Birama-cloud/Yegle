# Thème de base clair (espace services, riche en composants natifs).
# Les pages citoyen passent en sombre par le CSS de ui/common.py.
[theme]
base = "light"
primaryColor = "#1E5BD8"
backgroundColor = "#F4F7FC"
secondaryBackgroundColor = "#EEF3FB"
textColor = "#0B1F4B"

[client]
toolbarMode = "minimal"
showSidebarNavigation = false

[browser]
gatherUsageStats = false
