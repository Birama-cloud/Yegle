# ============================================================================
#  LEXIQUE WOLOF DE L'ÉCOUTE
#  Donné au modèle avant chaque transcription d'un vocal, pour qu'il reconnaisse
#  et écrive correctement le wolof des signalements.
#
#  C'est ici qu'un locuteur améliore l'écoute, sans toucher au code :
#   - un mot est mal entendu ou mal écrit ? Ajoutez-le dans « mots » ;
#   - une tournure revient souvent ? Ajoutez une phrase type dans « phrases ».
#  Écrivez comme les gens écrivent vraiment, et gardez la même graphie partout.
#  Après modification : relancez l'application.
#
#  Relu et corrigé par un locuteur (Birama TOGOLA), octobre 2026.
#  Plusieurs façons de dire ? Séparez-les par « / » : wo: "kurant / courant".
#  Une ligne laissée vide ("") est ignorée par Yëgle : rien ne casse.
#  Limites : 120 mots et 30 phrases au maximum.
# ============================================================================
