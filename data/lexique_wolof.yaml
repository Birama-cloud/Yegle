phrases:
  # Le français est en commentaire après « # ».
  - "Ndox mi mongui ballë ci mbedd mi, fii ci Grand-Yoff"
  # Eau
  - "Ñaari fan a ngi nii, ndox amul ci robinet bi"   # Il n'y a pas d'eau au robinet depuis deux jours
  - "Tuyo bi dafa todj ci kanam jumaa ji"   # Un tuyau a éclaté devant la mosquée
  - "Ndoxu robinet bi dafa tilim"   # L'eau du robinet est sale
  # Assainissement
  - "Egout bi dafa fees ba tuuru ci sunu mbedd"   # L'égout déborde dans notre rue
  - "Caniveau bi dafa tëju, ndox mi mënul dem"   # Le caniveau est bouché, l'eau ne s'en va pas
  - "Ginnaaw taw bi, ndox mi dafa fees ci biir gox bi"   # Après la pluie, le quartier est inondé
  - "Dafa xasaw lool te yoo yi bari nañu"   # Ça sent très mauvais et il y a beaucoup de moustiques
  # Électricité
  - "Kurant bi dafa dém ci suba ba léegi"   # Il n'y a pas de courant depuis ce matin
  - "Fil bi daanu na ci suuf, mën na am musiba ci xale yi"   # Un câble est tombé par terre, c'est dangereux pour les enfants
  - "Poteau bi dafa wengu, dina daanu"   # Le poteau penche, il va tomber
  - "Transfo bi dafay génne safara"   # Le transformateur fait des étincelles
  # Éclairage public
  - "Lampadaire bu sunu mbedd bi, tàkk a tul"   # Le lampadaire de notre rue ne s'allume plus
  - "Guddi, mbedd mi dafa lëndëm këruus"   # La nuit, la rue est toute noire
  # Voirie
  - "Am na pax bu mag ci yoon wi, oto yi dañuy yàqu"   # Il y a un grand trou sur la route, les voitures s'abîment
  - "Yoon wi dafa fees ak suuf"   # La route est pleine de sable
  - "Trottoir bi dafa todj"   # Le trottoir est cassé
  # Propreté
  - "Am na mbalit mu bari ci carrefour bi"   # Il y a un tas d'ordures au carrefour
  - "Camion mbalit bi jaarut, benn semaine a ngi nii"   # Le camion poubelle ne passe plus depuis une semaine
  - "Nit ñi dañuy lakk mbalit mi, saxar bi bari na"   # Les gens brûlent les ordures, il y a de la fumée
  # Infrastructure
  - "Miiru lekkool bi daanu na"   # Le mur de l'école est tombé
  - "Passerelle bi dafa yàqu, mën a am musiba"   # La passerelle est abîmée, c'est dangereux
  # Lieu et gravité
  - "Mu ngi janoo ak marse bi, ci wetu arrêt bi"   # C'est en face du marché, à côté de l'arrêt de bus
  - "Mu ngi ci ginnaaw jumaa ju sama gox"   # C'est derrière la mosquée de mon quartier
  - "Dafa yàkkamti, te kenn ñëwul"   # C'est urgent, personne n'est venu