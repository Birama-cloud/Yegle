# Une seule fiche pour toutes les mairies : le nom est complété avec la commune
# du signalement. Sans commune identifiée, le signalement part en vérification.
#
# NON VÉRIFIÉE (contrôle du 2026-10-09) : la loi ne confie pas ces domaines à la commune seule.
# - Propreté : déchets transférés à la ville (CGCL, loi 2013-10, art. 170) ; collecte assurée
#   par la SONAGED sur tout le territoire (loi 2022-18 du 23/05/2022, art. 2).
# - Éclairage public : extension du réseau confiée à la ville (art. 169) ; le maire en a la
#   police dans les rues (art. 119).
# - Voirie : la commune gère la voirie non classée (art. 299) ; la ville, les voies et places
#   publiques (art. 169) ; la voirie classée relève de l'État.
- organization_id: ORG_MAIRIE
  organization_name: "Mairie de {commune}"
  organization_type: collectivite_territoriale
  per_commune: true
  domains: [voirie, eclairage_public, proprete, infrastructure]
  subcategories: []
  territorial_coverage: ["region:dakar"]
  responsible_services:
    - {name: "Services techniques", subcategories: []}
  contact_channels: []
  api_endpoint_if_available: null
  transmission_mode: internal_queue
  routing_rules:
    - {rule_id: R_VOIRIE_01, category: voirie, confidence: 0.80}
    - {rule_id: R_ECL_01, category: eclairage_public, confidence: 0.80}
    - {rule_id: R_PROP_01, category: proprete, confidence: 0.80}
    - {rule_id: R_INFRA_01, category: infrastructure, confidence: 0.70}
  escalation_rules: []
  active_status: true
  last_verified_at: null
  source_url: null
