# ============================================================================
#  BASE DE CONNAISSANCES INSTITUTIONNELLE
#  Source de vérité du moteur d'orientation. Modifiable sans toucher au code
#  ni au modèle d'IA. Après modification : python -m scripts.check_setup
#
#  ATTENTION : les compétences ci-dessous reprennent les exemples du cahier
#  des charges. Elles ne sont PAS encore vérifiées (last_verified_at: null).
#  Tant qu'une fiche n'a pas de date de vérification, aucun signalement ne
#  lui est envoyé automatiquement : il passe en vérification humaine.
#  Pour valider une fiche : contrôler la compétence et la zone sur une source
#  officielle, renseigner source_url, puis last_verified_at: "AAAA-MM-JJ".
#
#  territorial_coverage : national | region:<id> | departement:<id> | zone:<id>
#  transmission_mode    : internal_queue | webhook (exige api_endpoint_if_available en https)
# ============================================================================

- organization_id: ORG_SENEAU
  organization_name: "SEN'EAU"
  organization_type: operateur_de_service_public
  domains: [eau]
  subcategories: []                 # vide = toutes les sous-catégories du domaine
  territorial_coverage: ["region:dakar"]
  responsible_services:
    - {name: "Service compétent", subcategories: []}
  contact_channels: []              # à compléter depuis la source officielle
  api_endpoint_if_available: null
  transmission_mode: internal_queue
  routing_rules:
    - {rule_id: R_EAU_01, category: eau, confidence: 0.90}
  escalation_rules:
    - {when_urgency: [critical], action: notify_admin}
  active_status: true
  last_verified_at: null
  source_url: null

