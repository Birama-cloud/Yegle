# ============================================================================
#  BASE DE CONNAISSANCES INSTITUTIONNELLE
#  Source de vérité du moteur d'orientation. Modifiable sans toucher au code
#  ni au modèle d'IA. Après modification : python -m scripts.check_setup
#
#  ATTENTION : les compétences ci-dessous reprennent les exemples du cahier
#  des charges. Elles ne sont PAS encore vérifiées (last_verified_at: null).
#  Tant qu'une fiche n'a pas de date de vérification, aucun signalement ne
#  lui est envoyé automatiquement : il passe en vérification humaine.
#  Pour valider une fiche : contrôler la compétence et la zone sur une source
#  officielle, renseigner source_url, puis last_verified_at: "AAAA-MM-JJ".
#
#  territorial_coverage : national | region:<id> | departement:<id> | zone:<id>
#  transmission_mode    : internal_queue | webhook (exige api_endpoint_if_available en https)
#  escalation_rules     : [{when_urgency: [high, critical], action: notify_admin}] déclenche une alerte
#                         d'urgence. L'urgence « critical » alerte toujours, même sans règle.
# ============================================================================

- organization_id: ORG_SENEAU
  organization_name: "SEN'EAU"
  organization_type: operateur_de_service_public
  domains: [eau]
  subcategories: []                 # vide = toutes les sous-catégories du domaine
  territorial_coverage: ["region:dakar"]
  responsible_services:
    - {name: "Service compétent", subcategories: []}
  # Fermier du service public de l'eau potable en zone urbaine (contrat d'affermage signé
  # le 30/12/2019, en service depuis le 01/01/2020). Le site ne précise pas le périmètre exact.
  contact_channels:
    - {type: telephone, value: "800 001 111", note: "appel gratuit, 24h/24"}
    - {type: whatsapp, value: "+221 78 935 51 51", note: "service client"}
  api_endpoint_if_available: null
  transmission_mode: internal_queue
  routing_rules:
    - {rule_id: R_EAU_01, category: eau, confidence: 0.90}
  escalation_rules:
    - {when_urgency: [critical], action: notify_admin}
  active_status: true
  last_verified_at: "2026-10-09"
  source_url: "https://www.seneau.sn"

- organization_id: ORG_ONAS
  organization_name: "ONAS"
  organization_type: etablissement_public
  domains: [assainissement]
  subcategories: []
  territorial_coverage: ["region:dakar"]
  responsible_services:
    - {name: "Service compétent", subcategories: []}
  # EPIC créé par la loi n° 96-02 du 22/02/1996, réorganisé par le décret n° 2023-1004 du 08/05/2023.
  # Mission : assainissement collectif et autonome, eaux usées et pluviales, sur tout le territoire national.
  contact_channels:
    - {type: telephone, value: "81 800 10 12", note: "réclamations et urgences assainissement, 24h/24"}
    - {type: email, value: "onas@onas.sn"}
  api_endpoint_if_available: null
  transmission_mode: internal_queue
  routing_rules:
    - {rule_id: R_ASS_01, category: assainissement, confidence: 0.90}
  escalation_rules:
    - {when_urgency: [critical], action: notify_admin}
  active_status: true
  last_verified_at: "2026-10-09"
  source_url: "https://www.onas.sn"

